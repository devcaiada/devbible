name: Validate Content & Markdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown & Link Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Markdown Linter & Link Checker
        run: npm install -g markdownlint-cli markdown-link-check

      - name: Run Markdown Linter
        run: |
          markdownlint '**/*.md' --ignore node_modules --ignore .system_generated || true

      - name: Validate Markdown Links
        run: |
          find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -exec markdown-link-check {} --config .github/markdown-link-check.json \; || true
